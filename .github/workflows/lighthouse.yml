name: Lighthouse audit

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse scores
    runs-on: ubuntu-latest
    env:
      LIGHTHOUSE_MIN_PERFORMANCE: "90"
      LIGHTHOUSE_MIN_ACCESSIBILITY: "90"
      LIGHTHOUSE_MIN_SEO: "95"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pnpm
        run: npm install --global pnpm@10.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Build site
        run: pnpm run build

      - name: Start local production preview
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/openclow-preview.log 2>&1 &
          echo $! > /tmp/openclow-preview.pid

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/openclow-preview.log
          exit 1

      - name: Run Lighthouse desktop and mobile
        env:
          LIGHTHOUSE_URL: http://127.0.0.1:4173/
        run: pnpm run lighthouse:live

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.run_id }}
          path: artifacts/lighthouse/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop preview
        if: always()
        run: kill "$(cat /tmp/openclow-preview.pid)" 2>/dev/null || true
